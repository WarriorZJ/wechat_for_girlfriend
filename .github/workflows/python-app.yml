name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '00 21 * * *'  # UTC 23:00 → 北京 07:00
    - cron: '00 04 * * *'  # UTC 09:00 → 北京 17:00

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 4. 代码检查
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 5. 运行主程序（带重试）
      # 解密密钥通过仓库 Secrets 中的 WECHAT_CONF_KEY 注入，不会出现在代码或日志里
      - name: Run Python script with retry
        env:
          WECHAT_CONF_KEY: ${{ secrets.WECHAT_CONF_KEY }}
        run: |
          for i in {1..3}; do
            echo "尝试运行 main.py (第 $i 次)..."
            python main.py && break
            echo "执行失败，10 秒后重试..."
            sleep 10
          done
